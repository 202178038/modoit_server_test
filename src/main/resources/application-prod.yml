spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}           # ← cloudtype.yml env 와 매칭
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}   # update · none · validate …

