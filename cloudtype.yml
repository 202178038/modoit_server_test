# cloudtype.yml
name: routine-backend

app:
  build:
    context: .
    dockerfile: Dockerfile
  port: 8080

  env:                       # ← 리스트(+name, value) 형식
    - name: SPRING_DATASOURCE_URL
      value: jdbc:mariadb://${addon.routine-db.host}:${addon.routine-db.port}/${addon.routine-db.database}?characterEncoding=utf8&serverTimezone=Asia/Seoul
    - name: SPRING_DATASOURCE_USERNAME
      value: ${addon.routine-db.username}
    - name: SPRING_DATASOURCE_PASSWORD
      value: ${addon.routine-db.password}
    - name: SPRING_JPA_HIBERNATE_DDL_AUTO
      value: update

addons:                      # ← 역시 리스트 형식
  - name: routine-db         # Add-on 이름
    type: mariadb
    plan: free
    version: "10.6"
